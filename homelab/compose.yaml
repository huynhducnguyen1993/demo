name: homelab-d7-t9

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  uptime_kuma:
  postgres:
  redis:
  adguard_work:
  adguard_conf:
  dockge_data:
  stacks:
  rustdesk:

services:
  caddy:
    image: caddy:2.11.7-alpine
    container_name: t9-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - homepage
      - uptime-kuma
      - dozzle
      - adguard

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: t9-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      INFO: 1
      PING: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0
    container_name: t9-homepage
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost}
      HOMEPAGE_VAR_LAB_DOMAIN: ${LAB_DOMAIN:-t9.lab}
    volumes:
      - ./homepage:/app/config:ro
    networks:
      - edge
    depends_on:
      - socket-proxy

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    container_name: t9-uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - uptime_kuma:/app/data
    networks:
      - edge

  dozzle:
    image: amir20/dozzle:v11.3.2-alpine
    container_name: t9-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: t9
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: t9-adguard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${BIND_IP:-0.0.0.0}:${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${BIND_IP:-0.0.0.0}:${ADGUARD_DNS_PORT:-53}:53/udp"
      - "${BIND_IP:-0.0.0.0}:${ADGUARD_SETUP_PORT:-3000}:3000/tcp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - edge

  postgres:
    image: postgres:16.15-alpine
    container_name: t9-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.11-alpine
    container_name: t9-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dockge:
    profiles: ["quan-tri"]
    image: louislam/dockge:1.5.0
    container_name: t9-dockge
    restart: unless-stopped
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      - stacks:/opt/stacks
    networks:
      - edge

  rustdesk-hbbs:
    profiles: ["rustdesk"]
    image: rustdesk/rustdesk-server:1.1.16
    container_name: t9-rustdesk-hbbs
    command: hbbs
    restart: unless-stopped
    volumes:
      - rustdesk:/root
    networks:
      - edge
    ports:
      - "${BIND_IP:-0.0.0.0}:21115:21115"
      - "${BIND_IP:-0.0.0.0}:21116:21116"
      - "${BIND_IP:-0.0.0.0}:21116:21116/udp"
      - "${BIND_IP:-0.0.0.0}:21118:21118"

  rustdesk-hbbr:
    profiles: ["rustdesk"]
    image: rustdesk/rustdesk-server:1.1.16
    container_name: t9-rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    depends_on:
      - rustdesk-hbbs
    volumes:
      - rustdesk:/root
    networks:
      - edge
    ports:
      - "${BIND_IP:-0.0.0.0}:21117:21117"
      - "${BIND_IP:-0.0.0.0}:21119:21119"
